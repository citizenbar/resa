<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citizen Bar — Programmation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f7f5f0'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23d92e15'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="container">
  <header class="top">
    <div class="brand" onclick="go('portal')">
      <span class="eyebrow">Citizen Bar · Tours</span>
      <span class="name">PROGRAM<b>·</b>MATION</span>
    </div>
    <nav class="tabs" id="mainTabs">
      <button class="tab active" data-tab="portal" onclick="go('portal')">Agenda</button>
      <button class="tab" data-tab="op" onclick="go('op')">Open Platine</button>
      <button class="tab" data-tab="rc" onclick="go('rc')">Radio Campus</button>
      <button class="tab" data-tab="ev" onclick="go('ev')">Events</button>
    </nav>
  </header>

  <main id="app"></main>

  <footer>— CITIZEN BAR — TOURS —</footer>
</div>

<!-- SDK Supabase (CDN). Expose le global `supabase`. Version épinglée (évite une montée auto). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.106.2"></script>

<!-- Scripts applicatifs, dans l'ordre de dépendance :
     config -> client -> helpers -> storage -> auth -> admin -> modules -> router -->
<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/helpers.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
<script src="js/portal.js"></script>
<script src="js/open-platine.js"></script>
<script src="js/radio-campus.js"></script>
<script src="js/events.js"></script>
<script src="js/router.js"></script>
</body>
</html>
